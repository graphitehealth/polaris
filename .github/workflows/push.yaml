name: Build Push

on:
  push:
    branches: [ "main" ]

jobs:

  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Get the current date in YYYY-mm-dd format to be used as the image tag
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Print Docker info
        run: docker -v
      
      # The following two steps are needed to enable multi-platform Docker builds
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Gradle build
        run: |
          ./gradlew \
            :polaris-quarkus-server:assemble \
            :polaris-quarkus-server:quarkusAppPartsBuild --rerun \
            :polaris-quarkus-admin:assemble \
            :polaris-quarkus-admin:quarkusAppPartsBuild --rerun \
            -PeclipseLinkDeps=org.postgresql:postgresql:42.7.4
      
      - name: Docker Login azure container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USER }}
          password: ${{ secrets.ACR_PASS }}

      - name: Set Docker Metadata for Polaris
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ vars.AZURE_CONTAINER_REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.date.outputs.date }}
      
      - name: Docker Build Push Polaris
        uses: docker/build-push-action@v5
        with:
          context: quarkus/server
          file: quarkus/server/src/main/docker/Dockerfile.jvm
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
      
      - name: Set Docker Metadata for Polaris Admin Tool
        uses: docker/metadata-action@v5
        id: meta-admin-tool
        with:
          images: |
            ${{ vars.AZURE_CONTAINER_REGISTRY }}/${{ github.repository }}-admin-tool
          tags: |
            type=raw,value=${{ steps.date.outputs.date }}
      
      - name: Docker Build Push Polaris Admin Tool
        uses: docker/build-push-action@v5
        with:
          context: quarkus/admin
          file: quarkus/admin/src/main/docker/Dockerfile.jvm
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-admin-tool.outputs.tags }}
